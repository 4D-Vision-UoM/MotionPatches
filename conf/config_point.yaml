exp_name: HumanML3D_PointCloud
checkpoints_dir: ./checkpoints/${exp_name}/${dataset.dataset_name}

hydra:
  run:
    dir: ./checkpoints/${exp_name}/${dataset.dataset_name}

defaults:
  - _self_
  - dataset: HumanML3D_points

preprocess:
  padding: true
  use_kinematic: true

model:
  motion_encoder: vit_base_patch16_224_in21k
  text_encoder: distilbert-base-uncased
  point_encoder:
    dvae_config:
      encoder_dim: 256
      group_size: 32
      num_group: 64
      num_tokens: 512
    transformer_config:
      embed_dim: 768
      depth: 4
      num_heads: 12
      mlp_ratio: 4.0
      qkv_bias: false
      qk_scale: null
      drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.1

train:
  batch_size: 32
  epoch: 50
  optimizer:
    motion_lr: 1.0e-05
    text_lr: 1.0e-05
    head_lr: 1.0e-05
  train_motion_encoder: true
  train_text_encoder: true
  motion_encoder_pretrained: true
  patch_size: 16
  seed: 42

eval:
  eval_train: false
  use_best_model: true